# Embedded source catalog (docs/superpowers/specs/2026-10-26-michel-plan4-sources-design.md § 3.2).
# Bump version, and CatalogVersion in catalog.go, whenever an entry's name, url, hosts,
# purpose or config changes: Sync then rewrites those fields, never enabled, hidden,
# tech or the user settings. Each note is the i18n key source.note.<key> (hyphens
# become underscores). Only osv.packagist and osv.npm are enabled by default.
version: 4
entries:
  - key: osv.packagist
    kind: osv
    name: "OSV Packagist"
    url: "https://osv.dev/list?ecosystem=Packagist"
    hosts: ["osv-vulnerabilities.storage.googleapis.com"]
    purpose: osv.db
    enabled: true
    config: {ecosystem: "Packagist"}
    note: source.note.osv.packagist
