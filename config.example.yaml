# Michel sovereignty policy. Every value below is the built-in default.
# Delete this file and Michel behaves exactly the same.
sovereignty:
  mode: strict_local            # strict_local | standard
  data_classification: sensitive # public | internal | confidential | sensitive | health
  ai:
    provider_policy: local_only
    # The fix agent (Claude Code, docs/fix.md) is an external provider. A project's AI consent
    # (Fix page or 'michel fix consent <project> --yes') turns this on and adds its network rules.
    # strict_local refuses it: only the explicit button of the page's consent screen switches
    # mode to standard and this to true (keeping config.yaml.bak). Fix levels are set per
    # project ('michel project set <name> --fix-level 0..3'), not here.
    external_providers_enabled: false
    model_downloads_enabled: false
    automatic_model_updates: false
  network:
    default_egress: deny        # strict_local requires "deny"
    telemetry_enabled: false
    remote_error_reporting: false
    # 'michel source enable <key>' adds the rule a source needs here, after your consent
    # (keeping a copy of this file as config.yaml.bak); 'michel source disable <key> --forget' removes it.
    # Purposes: osv.db, source.enrich, source.feed, source.repo, source.discover, notify.email,
    # notify.webhook, fix.install, agent.claude. plugin.<key> is never allowed. Hosts of each
    # source: docs/sources.md; of the fix agent: docs/security/network-egress.md.
    # Example written by 'michel source enable enrich.kev':
    #   - {host: www.cisa.gov, purpose: source.enrich}
    # Rules written by a project's AI consent for the fix agent (docs/fix.md):
    #   - {host: api.anthropic.com, purpose: agent.claude}
    #   - {host: platform.claude.com, purpose: agent.claude}
    #   - {host: repo.packagist.org, purpose: fix.install}   # also packagist.org, api.github.com,
    #                                                        # codeload.github.com, registry.npmjs.org
    allow: []                   # each rule needs a host and a purpose
  audit:
    enabled: true
    integrity_protection: required
    prompt_content_retention: encrypted_configurable
  remediation:
    isolated_execution_required: true
    production_deployment_allowed: false # must stay false
    human_approval_required_for_merge: true
db:
  auto_update: false
  # osv_path: defaults to <data-dir>/osv
assistant:
  name: Michel
  lang: auto                    # auto | en | fr (auto = language of the system, English if not French)
# Public risk score (see docs/remediation-risk.md). The AI model never changes these.
risk:
  major_jump: 40                # points when the fix needs a major version jump
  breaking: 25                  # points when the changelog announces breaking changes
  direct: 10                    # points when the package is a direct dependency
  many_call_sites: 15           # points when call sites exceed the threshold below
  no_tests: 20                  # points when no test touches the package
  core_package: 20              # points when the project lists it as a core package
  many_call_sites_threshold: 10
  auto_fix_below: 30            # score < 30 -> auto_fix
  handoff_up_to: 60             # 30..60 -> handoff, > 60 -> handoff with a warning
# Where the digest is sent (michel digest --send). No channel by default.
# An enabled email, webhook or sms channel needs its own rule in sovereignty.network.allow,
# for example {host: smtp.example.org, purpose: notify.email}, {host: hooks.example.org, purpose: notify.webhook}
# or {host: smsapi.free-mobile.fr, purpose: notify.sms}.
# Passwords and signing keys are never written here: store them with 'michel secret set <name>'.
notify:
  page_url: http://127.0.0.1:7331/ # link to the "Today" page put in the digests; never carries the access token
  # channels:
  #   - name: mail-perso           # free identifier, unique
  #     type: email
  #     enabled: true
  #     host: smtp.example.org
  #     port: 587                  # 587 = STARTTLS, 465 = implicit TLS; nothing else
  #     from: michel@example.org
  #     to: [me@example.org]
  #     username: me
  #     password_secret: smtp-perso # name in the secret store, never the value
  #     projects: []               # empty = every project; else a list of project names
  #   - name: hook-n8n
  #     type: webhook
  #     url: https://hooks.example.org/michel
  #     format: generic            # generic | slack | discord
  #     secret: hook-n8n           # name of the HMAC signing key; required unless the url is on this machine
  #   - name: bureau
  #     type: toast                # a notification on this computer's desktop
  #   - name: sms-urgent           # SMS: only for an urgent server alert (a flaw exploited in the wild or critical
  #     type: sms                  # on a production server, or a fix that could not be undone); never the digest
  #     provider: freemobile       # freemobile | generic
  #     user: "12345678"           # your Free Mobile login
  #     secret: sms-urgent         # name of the secret holding the Free Mobile key (michel secret set sms-urgent)
  #     urgent: true               # must be true for this channel to send anything
  #     # url: only for tests (a local receiver); the key goes wherever it points. Leave it out for Free Mobile.
  #     # generic provider instead: url: https://sms.example.org/send  (POST {"text"}, signed with the secret like a webhook)
  # sms_per_day: 3               # most SMS in a day (local time), all channels together (default 3)
